<section>
<h2>الوحدة 1: من البيانات إلى القرار</h2>
<ol>
<li><p>تسألك زميلة: «ما النموذج في إذن بالضبط؟». أي وصف هو الصحيح؟</p><ul><li><b>أ.</b> القاعدة التي تحيل كل إجازة مرضية إلى مشرف</li><li><b>ب.</b> جدول الطلبات الثمانمئة من عام 2025</li><li><b>ج.</b> الجزء الذي يعطي كل طلب درجة من 0 إلى 100 مما تعلّمه من الأمثلة</li><li><b>د.</b> المشرف الذي يقرأ الطلبات المحوّلة إلى «مراجعة»</li></ul></li>
<li><p>في أداة تصنّف شكاوى العملاء إلى «عاجلة» و«عادية»، أيّ مما يلي اختاره إنسان ولم يتعلمه النموذج من البيانات؟ اختر كل ما ينطبق.</p><ul><li><b>أ.</b> أن تُعدّ الشكوى «عاجلة» إذا ردّ عليها الموظف في اليوم نفسه</li><li><b>ب.</b> أن كلمة «تسمم» ترتبط كثيرًا بالشكاوى العاجلة</li><li><b>ج.</b> أن تُستخدم شكاوى السنة الماضية وحدها للتدريب</li><li><b>د.</b> أن الشكوى التي درجتها 70 فأعلى تذهب إلى المدير المناوب</li></ul></li>
<li><p>شركة تأمين تبني أداة تتوقع أي المطالبات تحتاج إلى تدقيق. في جدول التدريب لكل مطالبة: مبلغها، ونوع الوثيقة، وعمر الوثيقة، وعمود أخير كتب فيه المدقق قبل عام «دُققت» أو «صُرفت مباشرة». أي عمود هو الوسم؟</p><ul><li><b>أ.</b> مبلغ المطالبة</li><li><b>ب.</b> ما كتبه المدقق قبل عام</li><li><b>ج.</b> نوع الوثيقة</li><li><b>د.</b> رقم المطالبة في نظام الشركة</li></ul></li>
<li><p>في أداة تفرز طلبات الدعم الفني، تذهب إلى المهندس المناوب كل تذكرة درجتها 65 فأعلى. بعد شهر اشتكى المهندسون من كثرة التذاكر. من يملك تغيير الرقم 65؟</p><ul><li><b>أ.</b> النموذج نفسه، لأنه يتعلم الرقم الأنسب من بيانات التذاكر في كل شهر</li><li><b>ب.</b> المورِّد، لأن الرقم جزء من المنتج</li><li><b>ج.</b> لا أحد، فالرقم نتيجة حسابية للاختبار</li><li><b>د.</b> صاحب القرار في الجهة، لأنه خيار بين تأخير وأخطاء</li></ul></li>
<li><p>رتّب محطات الطريق من البيانات إلى القرار في أداة تصنيف، من الأولى إلى الأخيرة.</p><ul><li>اختيار العتبة التي يُتصرف عندها</li><li>تدريب النموذج على جزء من الأمثلة</li><li>مراجعة بشرية للحالات المحوّلة</li><li>جمع أمثلة من الماضي مع وسومها</li><li>اختبار النموذج على أمثلة محجوزة لم يرها</li></ul></li>
<li><p>مساعد في بوابة جهة حكومية يجيب عن أسئلة الموظفين. عند كل سؤال يبحث في دليل الإجراءات عن الفقرات الأقرب، ثم يكتب نموذج لغوي الجواب منها. أي جزء هو «الاسترجاع»؟</p><ul><li><b>أ.</b> البحث في دليل الإجراءات عن الفقرات الأقرب إلى السؤال</li><li><b>ب.</b> كتابة الجواب بلغة سليمة</li><li><b>ج.</b> حفظ النموذج اللغوي لدليل الإجراءات كله في أثناء تدريبه الأول</li><li><b>د.</b> مراجعة موظف للجواب قبل إرساله</li></ul></li>
<li><p>أداة تكشف الفواتير المكررة. أيّ مما يلي جزء من النظام المحيط بالنموذج، وليس النموذج نفسه؟ اختر كل ما ينطبق.</p><ul><li><b>أ.</b> قاعدة مكتوبة: كل فاتورة فوق 100,000 ريال تُراجع يدويًا</li><li><b>ب.</b> محاسب يقرأ الفواتير المنبَّه عليها ويقرر</li><li><b>ج.</b> الجزء الذي يعطي كل فاتورة درجة تشابه مما تعلّمه من الأمثلة</li><li><b>د.</b> أداة توقف صرف الفاتورة في النظام المالي عند التنبيه</li></ul></li>
</ol>
</section>
<section>
<h2>الوحدة 2: التعلم والتعميم</h2>
<ol>
<li><p>يحوّل «إذن» إلى المراجعة أغلب الطلبات التي إشعارها أقل من أسبوع. من أين جاء هذا الحد؟</p><ul><li><b>أ.</b> استخرجه النموذج من قرارات المشرفين في طلبات عام 2025</li><li><b>ب.</b> كتبه موظف في إدارة الموارد البشرية داخل الأداة</li><li><b>ج.</b> قرأه النموذج في لائحة الإجازات</li><li><b>د.</b> اختارته مديرة الموارد البشرية مع العتبة</li></ul></li>
<li><p>يعرض عليك محلل نموذجين لفرز طلبات الصيانة. النموذج أ: 99% في التدريب و79% في الاختبار. النموذج ب: 87% في التدريب و85% في الاختبار. أيهما تشغّل؟</p><ul><li><b>أ.</b> النموذج أ، لأن 99% أعلى رقم في العرض</li><li><b>ب.</b> النموذج أ، لأن متوسط رقميه أعلى</li><li><b>ج.</b> لا هذا ولا ذاك، فالنموذج ب لم يتعلم كفاية</li><li><b>د.</b> النموذج ب، لأن رقم الاختبار أعلى والفجوة صغيرة</li></ul></li>
<li><p>نموذج في بنك يتوقع من سيتأخر في السداد. كان يصيب في 91% من الحالات عند اختباره. بعد أن بدأ البنك يمنح قروضًا لأصحاب المشاريع الصغيرة انخفض إلى 74%، ولم يعدّل أحد النموذج. ما أدق وصف لما حدث؟</p><ul><li><b>أ.</b> فرط تخصيص: النموذج حفظ بيانات التدريب</li><li><b>ب.</b> تغير البيانات: عملاء جدد لا يشبهون من تعلّم منهم النموذج</li><li><b>ج.</b> تآكل: النماذج تضعف مع كثرة الاستخدام</li><li><b>د.</b> خطأ في الاختبار الأول: 91% لم تكن صحيحة</li></ul></li>
<li><p>عرض مورِّد نموذجين لتصنيف الشكاوى. الأول: 99% على بيانات التدريب و81% على بيانات الاختبار. الثاني: 90% و88%. ماذا يقول الفرق في النموذج الأول؟</p><ul><li><b>أ.</b> أنه أفضل، لأن 99% أعلى رقم في العرض</li><li><b>ب.</b> أنه حفظ بيانات التدريب ولا يعمّم جيدًا: فرط تخصيص</li><li><b>ج.</b> أن بيانات الاختبار معيبة ويجب استبدالها ببيانات أسهل منها</li><li><b>د.</b> أن النموذج يحتاج إلى عتبة أعلى</li></ul></li>
<li><p>نموذج يتوقع الطلب على خدمة حكومية كان يصيب في 90% من الأسابيع. بعد أن صارت الخدمة تُقدَّم عبر التطبيق بدل الفروع انخفض إلى 70%، ولم يغيّر أحد النموذج. ما التفسير الأرجح؟</p><ul><li><b>أ.</b> النموذج تعطل ويحتاج إلى إعادة تشغيل على خادم أسرع من الحالي</li><li><b>ب.</b> بيانات التدريب كانت قليلة منذ البداية</li><li><b>ج.</b> العتبة منخفضة أكثر مما يجب</li><li><b>د.</b> تغير البيانات: ما تعلّم منه النموذج لم يعد قائمًا</li></ul></li>
<li><p>نموذج انخفض أداؤه لأن إجراءات العمل تغيرت هذا العام. إضافة عشرة أضعاف البيانات من العام الماضي إلى تدريبه تعالج الانخفاض.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>تقول نشرة مورِّد: «صحة إجمالية 98%، قيست على 50,000 حالة استخدمناها في بناء النموذج». ما أول سؤال تطرحه؟</p><ul><li><b>أ.</b> ما الصحة الإجمالية على حالات لم يرها النموذج في تدريبه؟</li><li><b>ب.</b> هل يمكن رفع عدد الحالات إلى 100,000؟</li><li><b>ج.</b> كم استغرق تدريب النموذج؟</li><li><b>د.</b> هل النموذج من أحدث نوع؟</li></ul></li>
</ol>
</section>
<section>
<h2>الوحدة 3: الأخطاء والمعدلات الأساسية والعتبات</h2>
<ol>
<li><p>يقول مورِّد: «نموذجنا يصيب في 99% من الحالات التي بنيناه عليها». أي رقم تطلبه قبل أن تكمل الحديث؟</p><ul><li><b>أ.</b> الرقم نفسه على عدد أكبر من حالات البناء</li><li><b>ب.</b> زمن استجابة النموذج لكل حالة</li><li><b>ج.</b> الرقم على حالات محجوزة لم يرها النموذج، وتاريخ تلك الحالات</li><li><b>د.</b> عدد الخصائص التي يستخدمها النموذج</li></ul></li>
<li><p>فاحص يكشف 90% من الشحنات المخالفة ويبرئ 90% من الشحنات السليمة. من كل 1000 شحنة 40 مخالفة. كم نسبة التنبيهات الصحيحة؟ اكتب النسبة المئوية مقرّبة إلى أقرب عدد صحيح. <span class="unit">(%)</span></p></li>
<li><p>أداة في مستشفى تنبّه الممرضين إلى المرضى المعرضين لتدهور مفاجئ. تفويت مريض واحد خطير، والتنبيه الزائد يكلف زيارة تمريض قصيرة. اشتكى الفريق من أن الأداة فوّتت حالتين هذا الشهر. ما التعديل الأنسب؟</p><ul><li><b>أ.</b> رفع العتبة، لتصير التنبيهات أدق</li><li><b>ب.</b> خفض العتبة، وقبول تنبيهات كاذبة أكثر</li><li><b>ج.</b> اختيار العتبة التي تعطي أعلى صحة إجمالية</li><li><b>د.</b> ترك العتبة كما اختارها المورِّد</li></ul></li>
<li><p>كاشف أعطال يكشف 80% من القطع المعيبة ويبرئ 90% من القطع السليمة. من كل 1000 قطعة 50 معيبة. كم نسبة التنبيهات الصحيحة، أي المعيبة فعلًا من بين كل القطع التي نبّه عليها؟ اكتب النسبة المئوية مقرّبة إلى أقرب عدد صحيح. <span class="unit">(%)</span></p></li>
<li><p>في مصنع قطعة معيبة واحدة من كل 200 قطعة. اقترح موظف «فاحصًا» يقول عن كل قطعة إنها سليمة. ما صحته الإجمالية؟ وكم قطعة معيبة يكشف؟</p><ul><li><b>أ.</b> 50%، ويكشف نصف المعيب</li><li><b>ب.</b> 0%، لأنه لا يفحص شيئًا</li><li><b>ج.</b> 99.5%، ولا يكشف أي قطعة معيبة</li><li><b>د.</b> 99.5%، ويكشف 99.5% من القطع المعيبة</li></ul></li>
<li><p>خفّضت إدارة منع الخسائر عتبة كاشف الاحتيال من 75 إلى 60. ما الذي تتوقعه؟</p><ul><li><b>أ.</b> تنبيهات أقل، وحالات فائتة أقل، وإنذارات كاذبة أقل من قبل</li><li><b>ب.</b> تنبيهات أكثر، وحالات فائتة أقل، وإنذارات كاذبة أكثر</li><li><b>ج.</b> لا تغيير، فالنموذج نفسه لم يتغير</li><li><b>د.</b> تنبيهات أكثر، وكلها احتيال حقيقي، ولا إنذار كاذب واحد بينها</li></ul></li>
<li><p>يعرض مورِّد كاشفًا لحدث يقع مرة في كل مئة حالة، ويقول: «صحته الإجمالية 98%». أي استنتاج يصح؟</p><ul><li><b>أ.</b> الرقم لا يكفي: قاعدة لا تنبّه على شيء صحتها 99%</li><li><b>ب.</b> الكاشف ممتاز: يخطئ في حالتين من كل مئة فقط</li><li><b>ج.</b> 98% من تنبيهاته صحيحة</li><li><b>د.</b> يكشف 98% من الأحداث</li></ul></li>
</ol>
</section>
<section>
<h2>الوحدة 4: التسرب والتحيز</h2>
<ol>
<li><p>أداة تكشف الطلبات المزورة، والتزوير طلب واحد من كل مئة. يقول المورِّد: «الصحة الإجمالية 97%». ما الذي تعرفه من هذا الرقم وحده؟</p><ul><li><b>أ.</b> أن 97% من تنبيهاتها تزوير حقيقي</li><li><b>ب.</b> لا شيء كافيًا: قاعدة لا تنبّه على شيء صحتها 99%</li><li><b>ج.</b> أنها تكشف 97% من الطلبات المزورة</li><li><b>د.</b> أنها أداة ممتازة تخطئ في 3 طلبات من كل مئة</li></ul></li>
<li><p>نموذج يتوقع عند دخول المريض إلى الطوارئ هل سيُنوَّم في المستشفى. أي خاصية من هذه يجب حذفها قبل التدريب؟</p><ul><li><b>أ.</b> عمر المريض</li><li><b>ب.</b> الشكوى الرئيسية عند التسجيل</li><li><b>ج.</b> هل وصل المريض ليلًا أم نهارًا</li><li><b>د.</b> رقم السرير الذي خُصص للمريض</li></ul></li>
<li><p>نموذج يتوقع من يحتاج إلى زيارة منزلية من الخدمات الاجتماعية. بياناته من الطلبات المقدمة عبر البوابة الإلكترونية في ثلاث مدن كبرى. سيُستخدم في كل مناطق المملكة. ما المشكلة الأوضح، ومن الأرجح أن يتضرر؟</p><ul><li><b>أ.</b> تسرب، وتتضرر الجهة التي تثق في رقم مبالغ فيه</li><li><b>ب.</b> بيانات قليلة، ويتضرر الجميع بالقدر نفسه</li><li><b>ج.</b> تغطية غير ممثلة، ويتضرر سكان القرى ومن لا يستخدمون البوابة</li><li><b>د.</b> وسوم غير موثوقة، ويتضرر موظفو الخدمات الاجتماعية</li></ul></li>
<li><p>نموذج يتوقع عند استلام الشكوى هل ستُصعَّد إلى الإدارة العليا. من خصائصه: نوع الشكوى، وقناة الاستلام، و«عدد الأيام حتى إغلاق الشكوى». صحته في الاختبار 97%. ما المشكلة؟</p><ul><li><b>أ.</b> الخصائص قليلة، والنموذج يحتاج إلى عشر خصائص أخرى على الأقل</li><li><b>ب.</b> نوع الشكوى خاصية متحيزة</li><li><b>ج.</b> عدد أيام الإغلاق لا يُعرف عند الاستلام: تسرب</li><li><b>د.</b> 97% رقم منخفض لمثل هذه المهمة</li></ul></li>
<li><p>أداة تحوّل مكالمات مركز الاتصال إلى نص. دُرّبت على تسجيلات من مدينة واحدة، وسيستخدمها المركز لمتصلين من كل المناطق. من الأرجح أن يتضرر؟</p><ul><li><b>أ.</b> المتصلون بلهجات لم ترد في التسجيلات</li><li><b>ب.</b> المتصلون من المدينة نفسها</li><li><b>ج.</b> موظفو المركز، لأن الأداة ستعوضهم في الرد على المتصلين</li><li><b>د.</b> لا أحد، فاللغة واحدة</li></ul></li>
<li><p>نموذج يرشح الموظفين للترقية. وسمه في بيانات التدريب: «رُقّي خلال ثلاث سنوات»، من سجلات عشر سنوات مضت. ما الذي يتعلمه النموذج فعلًا؟</p><ul><li><b>أ.</b> من يستحق الترقية بحسب أدائه الفعلي في السنوات العشر</li><li><b>ب.</b> من سيبقى في الجهة مدة أطول</li><li><b>ج.</b> لا شيء، فالبيانات قديمة</li><li><b>د.</b> من كان يُرقّى في الماضي، بميول تلك القرارات</li></ul></li>
<li><p>حذف فريق خاصية «الجنس» من نموذج لفرز المتقدمين، وأبقى «انقطاع عن العمل أكثر من ستة أشهر» و«اسم الجامعة». هل زال احتمال التحيز؟</p><ul><li><b>أ.</b> نعم، فالنموذج لا يرى الجنس</li><li><b>ب.</b> لا، فالخاصيتان الباقيتان قد تدلان على الجنس</li><li><b>ج.</b> نعم، إذا كانت الصحة الإجمالية للنموذج مرتفعة في الاختبار</li><li><b>د.</b> لا، إلا إذا زيدت البيانات</li></ul></li>
</ol>
</section>
<section>
<h2>الوحدة 5: النماذج اللغوية: السلاسة لا تعني الصحة</h2>
<ol>
<li><p>نموذج يتوقع من سيلغي اشتراكه. صحته الإجمالية في الاختبار 98%. من خصائصه «سبب الإلغاء كما سجّله موظف خدمة العملاء». ما الذي يكشف المشكلة؟</p><ul><li><b>أ.</b> إعادة الاختبار على عينة أكبر من البيانات نفسها</li><li><b>ب.</b> المقارنة بين رقم التدريب ورقم الاختبار</li><li><b>ج.</b> تغيير العتبة التي يُتصرف عندها</li><li><b>د.</b> قراءة قائمة الخصائص والسؤال: متى سُجّلت كل خاصية؟</li></ul></li>
<li><p>سألتَ مساعدًا: «من يرأس اللجنة التي شُكّلت في وزارتنا الأسبوع الماضي؟» فأجاب باسم كامل ومنصب، بلغة واثقة. اللجنة جديدة ولم يُعلن عنها خارج الوزارة. ما أدق تفسير؟</p><ul><li><b>أ.</b> النموذج يخفي أنه لا يعرف ليبدو مفيدًا</li><li><b>ب.</b> المعلومة حديثة وداخلية فلم يرها، فأكمل باسم مرجّح</li><li><b>ج.</b> النموذج وافق رأيك لأنك سألت بثقة</li><li><b>د.</b> السؤال بالعربية، والنموذج أضعف فيها</li></ul></li>
<li><p>كتب لك مساعد محادثة مذكرة من صفحة عن سياسة العمل عن بعد، وستوقّعها وترسلها إلى مديرك. أيّ مما يلي يجب أن تتحقق منه في مصدره؟ اختر كل ما ينطبق.</p><ul><li><b>أ.</b> رقم المادة التي استشهد بها من لائحة جهتك</li><li><b>ب.</b> نسبة منسوبة إلى «دراسة حديثة» عن الإنتاجية</li><li><b>ج.</b> أن الجملة الافتتاحية مهذبة</li><li><b>د.</b> تاريخ سريان السياسة المذكور في المذكرة</li></ul></li>
<li><p>طلبتَ من مساعد محادثة مرجعًا عن موضوع دقيق، فأعطاك عنوان دراسة ومجلة وسنة وأرقام صفحات. بحثت فلم تجد لها أثرًا. ما التفسير الأرجح؟</p><ul><li><b>أ.</b> المساعد يتعمد التضليل</li><li><b>ب.</b> النموذج يتنبأ بالكلمة التالية، فأنتج شكل المرجع دون مصدر وراءه</li><li><b>ج.</b> الدراسة موجودة لكنها حُذفت من الإنترنت</li><li><b>د.</b> سؤالك كان غامضًا</li></ul></li>
<li><p>سألت مساعدًا عن لائحة صدرت الشهر الماضي في جهتك، فأجابك بثقة بأحكام اللائحة القديمة. لماذا؟</p><ul><li><b>أ.</b> لأنه يفضّل اللائحة القديمة</li><li><b>ب.</b> لأن اللائحة الجديدة أطول</li><li><b>ج.</b> لأن معرفته تقف عند تاريخ بيانات تدريبه، ولا يرى وثائق جهتك</li><li><b>د.</b> لأنه يحتاج إلى سؤال بالإنجليزية ليصل إلى اللوائح الحديثة في جهتك</li></ul></li>
<li><p>تريد أن تعرف من مساعد محادثة هل حسابك لمكافأة نهاية الخدمة صحيح. أي صياغة أقل عرضة لأن يوافقك النموذج لمجرد الموافقة؟</p><ul><li><b>أ.</b> «احسب مكافأة نهاية الخدمة لهذه الحالة واعرض خطواتك»</li><li><b>ب.</b> «حسبتها فكانت 48,000 ريال، وأنا متأكد من حسابي. صحيح؟»</li><li><b>ج.</b> «أكّد لي أن الناتج 48,000 ريال»</li><li><b>د.</b> «كل زملائي يقولون 48,000. أليس كذلك؟»</li></ul></li>
<li><p>جواب مكتوب بلغة سليمة وواثقة ومرتبة دليل على أن النموذج اللغوي تحقق من صحة ما كتب.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
</ol>
</section>
<section>
<h2>الوحدة 6: مساءلة الادعاء</h2>
<ol>
<li><p>تريد أن تتأكد من مساعد محادثة أن فهمك لمادة في لائحة جهتك صحيح. أي طريقة أقل عرضة للخطأ؟</p><ul><li><b>أ.</b> تكتب فهمك وتسأله: «أليس هذا صحيحًا؟»</li><li><b>ب.</b> تلصق نص المادة وتسأله عن معناها دون أن تذكر فهمك</li><li><b>ج.</b> تسأله عن المادة برقمها فقط، فهو يعرف اللوائح</li><li><b>د.</b> تسأله السؤال نفسه ثلاث مرات وتأخذ الجواب المتكرر</li></ul></li>
<li><p>تقول نشرة أداة تكشف الغش في الاختبارات الإلكترونية: «تكشف 98% من حالات الغش. مجرَّبة على 20,000 اختبار في جامعات شريكة. خالية من التحيز». أيّ مما يلي دليل غائب يجب طلبه؟ اختر كل ما ينطبق.</p><ul><li><b>أ.</b> كم طالبًا لم يغش ونبّهت عليه الأداة</li><li><b>ب.</b> نسبة الغش الفعلية في الاختبارات التي جُرّبت عليها</li><li><b>ج.</b> النتائج للطلاب ذوي الإعاقة ولمن يختبرون بلغة ثانية</li><li><b>د.</b> عدد المبرمجين الذين بنوا الأداة</li></ul></li>
<li><p>جهة تشغّل ثلاثة أنظمة: (أ) يرتب البريد الوارد بحسب الإدارة. (ب) يقترح على الموظف مسودة رد على استفسار. (ج) يوقف صرف الإعانة آليًا عمّن يشتبه في عدم استحقاقه. أيها يحتاج أولًا إلى إنسان يقرر قبل التنفيذ؟</p><ul><li><b>أ.</b> النظام ج، لأنه ينفذ قرارًا يمسّ شخصًا ويصعب التراجع عنه</li><li><b>ب.</b> النظام أ، لأنه يعالج أكبر عدد من الحالات</li><li><b>ج.</b> النظام ب، لأنه يستخدم نموذجًا لغويًا قد يخطئ</li><li><b>د.</b> الثلاثة بالقدر نفسه، فكلها ذكاء اصطناعي</li></ul></li>
<li><p>نظام في صندوق تمويل يحسب لكل طلب درجة، ويرسل رسالة رفض آلية لكل طلب درجته دون 40، ويحوّل الباقي إلى موظف. أين يجب أن يدخل الإنسان في الحلقة أولًا؟</p><ul><li><b>أ.</b> عند الطلبات التي درجتها فوق 90، للتأكد من الموافقة</li><li><b>ب.</b> عند تدريب النموذج فقط، وبعدها يعمل وحده</li><li><b>ج.</b> قبل إرسال الرفض، وأن يُتاح لصاحب الطلب أن يعترض</li><li><b>د.</b> لا حاجة، ما دامت الصحة الإجمالية للنموذج مرتفعة</li></ul></li>
<li><p>تقول نشرة: «صحة إجمالية 97%، مجرَّب على 10,000 حالة». أيّ مما يلي دليل ينقص النشرة ويجب طلبه؟ اختر كل ما ينطبق.</p><ul><li><b>أ.</b> نسبة الحالات الإيجابية في بيانات الاختبار</li><li><b>ب.</b> هل بيانات الاختبار غير البيانات التي تدرّب عليها النموذج</li><li><b>ج.</b> عدد موظفي الشركة المورِّدة</li><li><b>د.</b> النتائج لكل مجموعة فرعية من الناس</li></ul></li>
<li><p>أداة فرز تلتقط 90% من المرشحين المناسبين وتستبعد 90% من غير المناسبين. يصلك 1000 سيرة، المناسب منها 50. ما حال القائمة القصيرة؟</p><ul><li><b>أ.</b> نحو 50 سيرة، وكلها تقريبًا لمرشحين مناسبين</li><li><b>ب.</b> نحو 100 سيرة، و90% منها مناسبة</li><li><b>ج.</b> نحو 900 سيرة، ونصفها مناسب</li><li><b>د.</b> نحو 140 سيرة، وأقل من ثلثها مناسب</li></ul></li>
<li><p>بعد ستة أشهر من تشغيل أداة توصي بقبول المطالبات أو رفضها، تبيّن أن المراجعين يوافقون على 99% من توصياتها في أقل من عشر ثوانٍ لكل مطالبة. ماذا تسمي ذلك، وما العلاج الأنسب؟</p><ul><li><b>أ.</b> دليل على دقة الأداة، ولا علاج مطلوب</li><li><b>ب.</b> فرط تخصيص، ويعالج بإعادة التدريب</li><li><b>ج.</b> تحيز الأتمتة، ويعالج بعينة يراجعها المراجع قبل أن يرى التوصية</li><li><b>د.</b> تغير البيانات، ويعالج ببيانات أحدث</li></ul></li>
<li><p>اقتنعت مديرتك بأن نشرة المورِّد لا تكفي. أي طلب من المورِّد يعطيكم أقوى دليل قبل الشراء؟</p><ul><li><b>أ.</b> شهادات من ثلاثة عملاء آخرين</li><li><b>ب.</b> تجربة على بياناتكم، بنتائج لكل نوع من الخطأ ولكل مجموعة</li><li><b>ج.</b> عرض حي للأداة على أمثلة يختارها المورِّد</li><li><b>د.</b> ضمان مكتوب بأن الصحة الإجمالية لن تقل عن 95% طوال مدة العقد</li></ul></li>
</ol>
</section>

من سيبقى في الجهة مدة أطول"},{"key":"ج","text":"لا شيء، فالبيانات قديمة"},{"key":"د","text":"من كان يُرقّى في الماضي، بميول تلك القرارات"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"الوسم قرار بشري تاريخي. النموذج يكرر نمط تلك القرارات، فإن كانت تميل إلى فئة دون أخرى كرر الميل.","misconceptions":["يظن أن الوسم يقيس الاستحقاق: الوسم يسجل ما حدث لا ما كان يجب أن يحدث","يستنتج ما لا يقيسه الوسم: البقاء لم يُسجَّل في الوسم","يظن أن القِدم يمنع التعلم: النموذج يتعلم النمط القديم بإتقان، وهذه هي المشكلة",""],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"module4","id":"history-repeated","title":"النموذج يتعلم ما كان، لا ما يجب أن يكون"},"level":"analyze","pool":"practice"},{"id":"q-data-04","type":"single","prompt":"حذف فريق خاصية «الجنس» من نموذج لفرز المتقدمين، وأبقى «انقطاع عن العمل أكثر من ستة أشهر» و«اسم الجامعة». هل زال احتمال التحيز؟","options":[{"key":"أ","text":"نعم، فالنموذج لا يرى الجنس"},{"key":"ب","text":"لا، فالخاصيتان الباقيتان قد تدلان على الجنس"},{"key":"ج","text":"نعم، إذا كانت الصحة الإجمالية للنموذج مرتفعة في الاختبار"},{"key":"د","text":"لا، إلا إذا زيدت البيانات"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"خاصية ترتبط بالخاصية المحذوفة تؤدي دورها، وتسمى متغيرًا بديلًا. الدليل على الإنصاف هو النتائج بحسب المجموعات الفرعية، لا قائمة الخصائص.","misconceptions":["يظن أن حذف الخاصية يحذف أثرها: خصائص أخرى قد تدل عليها","","يظن أن رقمًا إجماليًا يثبت الإنصاف: الإنصاف يُقاس بنتائج كل مجموعة","يظن أن الكمية تعالج التحيز: بيانات أكثر بالنمط نفسه تثبّته"],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"module4","id":"three-biases","title":"ثلاثة أسئلة: من في البيانات؟ ومن كتب الوسم؟ وما الذي ينوب عن المحذوف؟"},"level":"analyze","pool":"practice"},{"id":"q-llm-01","type":"single","prompt":"طلبتَ من مساعد محادثة مرجعًا عن موضوع دقيق، فأعطاك عنوان دراسة ومجلة وسنة وأرقام صفحات. بحثت فلم تجد لها أثرًا. ما التفسير الأرجح؟","options":[{"key":"أ","text":"المساعد يتعمد التضليل"},{"key":"ب","text":"النموذ ن حسابي. صحيح؟»"},{"key":"ج","text":"«أكّد لي أن الناتج 48,000 ريال»"},{"key":"د","text":"«كل زملائي يقولون 48,000. أليس كذلك؟»"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"النموذج يميل إلى موافقة المستخدم. اسأل دون أن تعرض جوابك، ثم قارن أنت.","misconceptions":["","يعرض رأيه بصيغة الواثق: النموذج يميل إلى موافقة ما يعرضه المستخدم","يطلب التأكيد لا التحقق: الطلب نفسه يدفع النموذج إلى الموافقة","يضيف ضغطًا اجتماعيًا: النموذج يساير الادعاء المعروض عليه"],"lo":["LO2"],"day":5,"session":1,"slide":{"deck":"module5","id":"agrees-with-you","title":"صيغة سؤالك تميل بالجواب نحوك"},"level":"apply","pool":"practice"},{"id":"q-llm-04","type":"tf","prompt":"جواب مكتوب بلغة سليمة وواثقة ومرتبة دليل على أن النموذج اللغوي تحقق من صحة ما كتب.","options":[{"key":"أ","text":"صح"},{"key":"ب","text":"خطأ"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"السلاسة تأتي من التنبؤ بالكلمة التالية. الصحة تحتاج إلى مصدر تتحقق منه أنت.","misconceptions":["يأخذ السلاسة دليلًا على الصحة: النموذج يصوغ الخطأ والصواب بالثقة نفسها",""],"lo":["LO2"],"day":5,"session":1,"slide":{"deck":"module5","id":"next-word-prediction","title":"يتنبأ بالكلمة التالية، مرة بعد مرة"},"level":"understand","pool":"practice"},{"id":"q-claim-01","type":"multi","prompt":"تقول نشرة: «صحة إجمالية 97%، مجرَّب على 10,000 حالة». أيّ مما يلي دليل ينقص النشرة ويجب طلبه؟ اختر كل ما ينطبق.","options":[{"key":"أ","text":"نسبة الحالات الإيجابية في بيانات الاختبار"},{"key":"ب","text":"هل بيانات الاختبار غير البيانات التي تدرّب عليها النموذج"},{"key":"ج","text":"عدد موظفي الشركة المورِّدة"},{"key":"د","text":"النتائج لكل مجموعة فرعية من الناس"}],"correct":[0,1,3],"answer":null,"tolerance":null,"unit":null,"explanation":"الادعاء يدين لك بالمعدل الأساسي، وبأن الاختبار جرى على بيانات جديدة، وبنتائج المجموعات الفرعية، ومعها أنواع الأخطاء وشروط الاستخدام.","misconceptions":["","","يخلط سمعة المورِّد بدليل الأداء: حجم الشركة لا يقول شيئًا عن أخطاء الأداة",""],"lo":["LO6"],"day":6,"sessio ء في الوصف يدل على تغير البيانات"],"lo":["LO6"],"day":6,"session":1,"slide":{"deck":"module6","id":"automation-bias","title":"المراجع الذي يوافق دائمًا ليس مراجعة"},"level":"analyze","pool":"practice"},{"id":"q-claim-04","type":"single","prompt":"اقتنعت مديرتك بأن نشرة المورِّد لا تكفي. أي طلب من المورِّد يعطيكم أقوى دليل قبل الشراء؟","options":[{"key":"أ","text":"شهادات من ثلاثة عملاء آخرين"},{"key":"ب","text":"تجربة على بياناتكم، بنتائج لكل نوع من الخطأ ولكل مجموعة"},{"key":"ج","text":"عرض حي للأداة على أمثلة يختارها المورِّد"},{"key":"د","text":"ضمان مكتوب بأن الصحة الإجمالية لن تقل عن 95% طوال مدة العقد"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"أقوى دليل هو ما اختُبر على حالاتكم وفي ظروفكم، مفصّلًا بأنواع الأخطاء والمجموعات الفرعية.","misconceptions":["يأخذ رضا الآخرين دليلًا: بياناتهم ووظائفهم غير بياناتكم","","يقبل اختبارًا يختار المورِّد حالاته: الأمثلة المنتقاة تُظهر الأفضل","يكتفي بالصحة الإجمالية: الرقم قد يتحقق والأداة ترفض كل المناسبين"],"lo":["LO6"],"day":6,"session":1,"slide":{"deck":"module6","id":"tested-on-whom","title":"الرقم صحيح للحالات التي قيس عليها، لا لحالاتك"},"level":"evaluate","pool":"practice"}]}</script>
